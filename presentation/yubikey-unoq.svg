<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="1280" height="640" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- UNO Q board -->
  <rect x="40" y="60" width="360" height="200" rx="14" fill="#0b6e74"/>
  <rect x="40" y="60" width="360" height="200" rx="14" fill="none" stroke="#06474b" stroke-width="3"/>
  <!-- headers -->
  <g fill="#1b1b1b">
    <rect x="110" y="72" width="240" height="12" rx="2"/>
    <rect x="130" y="236" width="220" height="12" rx="2"/>
  </g>
  <g fill="#d4af37">
    <circle cx="120" cy="78" r="2.5"/><circle cx="140" cy="78" r="2.5"/><circle cx="160" cy="78" r="2.5"/><circle cx="180" cy="78" r="2.5"/><circle cx="200" cy="78" r="2.5"/><circle cx="220" cy="78" r="2.5"/><circle cx="240" cy="78" r="2.5"/><circle cx="260" cy="78" r="2.5"/><circle cx="280" cy="78" r="2.5"/><circle cx="300" cy="78" r="2.5"/><circle cx="320" cy="78" r="2.5"/><circle cx="340" cy="78" r="2.5"/>
    <circle cx="140" cy="242" r="2.5"/><circle cx="160" cy="242" r="2.5"/><circle cx="180" cy="242" r="2.5"/><circle cx="200" cy="242" r="2.5"/><circle cx="220" cy="242" r="2.5"/><circle cx="240" cy="242" r="2.5"/><circle cx="260" cy="242" r="2.5"/><circle cx="280" cy="242" r="2.5"/><circle cx="300" cy="242" r="2.5"/><circle cx="320" cy="242" r="2.5"/><circle cx="340" cy="242" r="2.5"/>
  </g>
  <!-- chips -->
  <rect x="170" y="120" width="70" height="70" rx="4" fill="#222"/>
  <text x="205" y="160" font-family="Helvetica,Arial" font-size="11" fill="#ccc" text-anchor="middle">Linux</text>
  <rect x="265" y="130" width="54" height="54" rx="4" fill="#222"/>
  <text x="292" y="161" font-family="Helvetica,Arial" font-size="11" fill="#ccc" text-anchor="middle">STM32</text>
  <text x="80" y="215" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#ffffff">UNO Q</text>
  <!-- USB-C port -->
  <rect x="388" y="146" width="22" height="28" rx="6" fill="#bfc3c7" stroke="#7d8287" stroke-width="2"/>
  <!-- YubiKey -->
  <rect x="408" y="152" width="20" height="16" rx="3" fill="#bfc3c7"/>
  <rect x="428" y="134" width="150" height="52" rx="10" fill="#1d1d1f"/>
  <circle cx="545" cy="160" r="14" fill="#d4af37"/>
  <circle cx="545" cy="160" r="9" fill="#e9c75a"/>
  <text x="482" y="166" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">YubiKey</text>
  <!-- caption -->
  <text x="320" y="300" font-family="Helvetica,Arial" font-size="16" fill="#333" text-anchor="middle">YubiKey 5 NFC + Arduino UNO Q</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
